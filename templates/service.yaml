apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend-service
  labels:
    app: {{ .Release.Name }}-backend
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - protocol: TCP
      port: 80           # Port the Service exposes inside the cluster
      targetPort: 8080   # Port your container is listening on

